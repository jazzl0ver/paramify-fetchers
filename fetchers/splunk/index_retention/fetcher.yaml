name: splunk_index_retention
version: 0.1.0
description: >-
  Every index on a Splunk deployment with how long it keeps data, whether
  frozen data is archived or deleted, and whether per-index data integrity
  control is on. One Splunk deployment per target.
category: splunk

supports_targets: true

target_schema:
  name:
    type: string
    required: true
    env: SPLUNK_TARGET_NAME
    description: Label for this Splunk deployment, used in the evidence filename.
  base_url:
    type: string
    required: true
    env: SPLUNK_BASE_URL
    description: Management URL of the search head or standalone instance, e.g. https://splunk.example.com:8089
  verify_ssl:
    type: boolean
    required: false
    default: true
    env: SPLUNK_VERIFY_SSL
    description: Verify the management port's TLS certificate. Set false only for a self-signed test instance.
  ca_bundle:
    type: string
    required: false
    env: SPLUNK_CA_BUNDLE
    description: >-
      Path to the CA bundle that signed the management port's certificate, for
      a deployment on a private CA. When set, TLS is verified against it and
      verify_ssl is ignored.

runtime:
  type: python
  entry: fetcher.py

output:
  type: json
  path: splunk_index_retention.json
  aggregation: per_target

secrets: []

ksis:
  - KSI-MLA-OSM

evidence_set:
  reference_id: EVD-SPLUNK-INDEX-RETENTION
  name: Splunk Index Retention and Integrity
  instructions: >-
    Reads a Splunk deployment's management REST API (port 8089) with a bearer
    token holding `search` and `rest_properties_get`. `indexes[]` is every
    index in `data/indexes?datatype=all`; the collection fails unless it
    matches paging.total and the indexes.conf stanzas and holds every index
    searchable on the peers. `retention_days` is frozenTimePeriodInSecs in
    whole days (0 freezes immediately), `archives_on_freeze` whether
    coldToFrozenDir or coldToFrozenScript keeps frozen data instead of deleting
    it, and `data_integrity_control` is enableDataIntegrityControl, null when
    unreadable.
